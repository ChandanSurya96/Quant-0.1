[project]
name = "markov2"
version = "2.1.0"
description = "Markov 2.0 regime framework with permutation-null, baseline and tradeability gates"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "yfinance>=0.2",
    "matplotlib>=3.7",
    "requests>=2.31.0",
]

[project.optional-dependencies]
test = ["pytest>=7.4", "pytest-cov>=4.1"]
enhanced = ["scikit-learn>=1.3"]
hmm = ["hmmlearn>=0.3"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["markov2", "quant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:markov2.*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
